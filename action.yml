name: 'git-tag-inc-action'
description: 'Download, install and run git-tag-inc'
author: 'arran4'

branding:
  icon: 'package'
  color: 'blue'

inputs:
  version:
    description: 'The version of git-tag-inc to install (e.g. "latest", "v0.0.18").'
    required: false
    default: 'latest'
  github-token:
    description: 'GitHub token to authenticate API requests to prevent rate limiting.'
    required: false
    default: ${{ github.token }}
  action:
    description: 'The action to run with git-tag-inc.'
    required: false
    default: ''
  ignore-same-hash:
    description: 'Ignore the error when git-tag-inc reports the hash is the same as the previous tag.'
    required: false
    default: 'true'
  mode:
    description: 'The execution mode: "install", "install and run", or "run".'
    required: false
    default: 'install and run'

outputs:
  version:
    description: 'The resulting version tag.'
    value: ${{ steps.run-action.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Run setup script
      if: ${{ inputs.mode == 'install' || inputs.mode == 'install and run' }}
      run: bash $GITHUB_ACTION_PATH/setup.sh "${{ inputs.version }}" "${{ inputs.github-token }}"
      shell: bash
    - name: Run git-tag-inc action
      id: run-action
      if: ${{ inputs.mode == 'run' || inputs.mode == 'install and run' }}
      run: |
        set +e
        OUTPUT=$(git-tag-inc ${{ inputs.action }} 2>&1)
        EXIT_CODE=$?
        set -e
        echo "$OUTPUT"
        if [ $EXIT_CODE -ne 0 ]; then
          if [ "${{ inputs.ignore-same-hash }}" = 'true' ] && echo "$OUTPUT" | grep -q "Hash is the same for this and previous tag"; then
            echo "Ignoring same hash error as requested."
          else
            exit $EXIT_CODE
          fi
        fi
        VERSION=$(git describe --tags --abbrev=0)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash
