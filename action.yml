name: 'git-tag-inc-action'
description: 'Download, install and run git-tag-inc'
author: 'arran4'

branding:
  icon: 'package'
  color: 'blue'

inputs:
  version:
    description: 'The version of git-tag-inc to install (e.g. "latest", "v0.0.18").'
    required: false
    default: 'latest'
  github-token:
    description: 'GitHub token to authenticate API requests to prevent rate limiting.'
    required: false
    default: ${{ github.token }}
  ref:
    description: 'The branch, tag, or ref to run from instead of downloading a specific version (e.g., "main", "v0.0.18"). This builds from source using go install.'
    required: false
    default: ''
  action:
    description: 'The action to run with git-tag-inc.'
    required: false
    default: ''
  mode:
    description: 'The execution mode: "install", "install and run", or "run".'
    required: false
    default: 'install and run'

outputs:
  version:
    description: 'The resulting version tag.'
    value: ${{ steps.run-action.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Run setup script
      if: ${{ inputs.mode == 'install' || inputs.mode == 'install and run' }}
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_REF: ${{ inputs.ref }}
      run: bash "$GITHUB_ACTION_PATH/setup.sh" "$INPUT_VERSION" "$INPUT_GITHUB_TOKEN" "$INPUT_REF"
      shell: bash
    - name: Run git-tag-inc action
      id: run-action
      if: ${{ inputs.mode == 'run' || inputs.mode == 'install and run' }}
      env:
        INPUT_ACTION: ${{ inputs.action }}
      run: |
        read -r -a GIT_TAG_INC_ARGS <<< "$INPUT_ACTION"
        git-tag-inc "${GIT_TAG_INC_ARGS[@]}"
        VERSION=$(git describe --tags --abbrev=0)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash
